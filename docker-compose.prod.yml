# Production: full stack (db + backend + frontend, optional nginx proxy)
#
# Ports bind to 127.0.0.1 by default so nothing is exposed beyond the host
# except nginx (profile with-proxy). To run without the proxy on a remote
# machine, set BACKEND_BIND / FRONTEND_BIND to 0.0.0.0 in .env.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ragui_db
    environment:
      POSTGRES_DB: ragui
      POSTGRES_USER: ragui
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragui"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragui_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ragui:${DB_PASSWORD}@db:5432/ragui
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      # Shared bearer token for the API (empty = no auth). Set this in prod.
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      # Each worker keeps its own model copies in memory — use 1 on small hosts.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - model_cache:/home/appuser/.cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser calls the backend directly (port published above).
        # When using the nginx profile, set PUBLIC_API_URL to your public origin instead.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    container_name: ragui_frontend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ragui_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    profiles: ["with-proxy"]

volumes:
  pgdata:
  model_cache:
